
name: Constitution 365 Hindi Daily Generator

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Day number (1-365). Leave empty for automatic day."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: constitution-365-hindi-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # NODE.JS
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # DETERMINE CONSTITUTION 365 DAY
      # ============================================================

      - name: Determine Day
        id: day
        shell: bash
        env:
          INPUT_DAY: ${{ inputs.day }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_DAY" ]; then
            DAY="$INPUT_DAY"
          else
            START_DATE="2026-10-06"
            TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)

            START_TS=$(date -u -d "$START_DATE" +%s)
            TODAY_TS=$(date -u -d "$TODAY" +%s)

            DAY=$(( (TODAY_TS - START_TS) / 86400 + 1 ))
          fi

          if ! [[ "$DAY" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Day must be a number."
            exit 1
          fi

          if [ "$DAY" -lt 1 ] || [ "$DAY" -gt 365 ]; then
            echo "ERROR: Invalid Constitution 365 day: $DAY"
            exit 1
          fi

          echo "=========================================="
          echo "CONSTITUTION 365 - HINDI"
          echo "=========================================="
          echo "Generating Day: $DAY"

          if [ -z "$INPUT_DAY" ]; then
            echo "Mode: Automatic"
            echo "IST Date: $TODAY"
            echo "Start Date: $START_DATE"
          else
            echo "Mode: Manual"
          fi

          echo "=========================================="

          echo "day=$DAY" >> "$GITHUB_OUTPUT"

      # ============================================================
      # GENERATE HINDI CONSTITUTION CONTENT
      # ============================================================

      - name: Generate Hindi Constitution Content
        env:
          DAY: ${{ steps.day.outputs.day }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: |
          set -euo pipefail

          node generator-hindi.js

      # ============================================================
      # VERIFY GENERATED HINDI JSON
      # ============================================================

      - name: Verify Generated Hindi JSON
        shell: bash
        env:
          DAY: ${{ steps.day.outputs.day }}
        run: |
          set -euo pipefail

          FILE="data/hi/day-$(printf '%03d' "$DAY").json"

          echo "Verifying: $FILE"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Generated file not found: $FILE"
            exit 1
          fi

          node - "$FILE" "$DAY" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];
          const expectedDay = Number(process.argv[3]);

          const x = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          function fail(message) {
            throw new Error(message);
          }

          if (!x || typeof x !== "object" || Array.isArray(x)) {
            fail("Generated JSON is not an object");
          }

          if (Number(x.day) !== expectedDay) {
            fail("Day mismatch");
          }

          const requiredStrings = [
            "title",
            "stage",
            "focus",
            "lesson",
            "why_it_matters",
            "common_misunderstanding",
            "reflection"
          ];

          for (const field of requiredStrings) {
            if (
              typeof x[field] !== "string" ||
              x[field].trim() === ""
            ) {
              fail(`Missing or empty field: ${field}`);
            }
          }

          // Check Hindi / Devanagari text.

          function validateHindi(value, label) {
            if (typeof value !== "string" || !value.trim()) {
              fail(`${label}: empty or invalid text`);
            }

            if (!/[\u0900-\u097F]/u.test(value)) {
              fail(`${label}: Hindi Devanagari text missing`);
            }

            if (/[A-Za-z]/u.test(value)) {
              fail(`${label}: English alphabet characters found`);
            }

            if (
              /[\u0400-\u04FF\u0370-\u03FF\u0590-\u05FF\u0600-\u06FF\u0980-\u09FF\u0A00-\u0A7F\u0A80-\u0AFF\u0B00-\u0B7F\u0B80-\u0BFF\u0C00-\u0CFF\u0D00-\u0D7F\u0E00-\u0E7F\u0E80-\u0EFF\u3040-\u30FF\u3400-\u9FFF\uAC00-\uD7AF]/u.test(value)
            ) {
              fail(`${label}: forbidden foreign script found`);
            }

            if (value.includes("\uFFFD")) {
              fail(`${label}: replacement character found`);
            }

            if (value.includes("\\")) {
              fail(`${label}: backslash found`);
            }
          }

          for (const field of requiredStrings) {
            validateHindi(x[field], field);
          }

          if (x.lesson.trim().length < 500) {
            fail("Lesson is too short");
          }

          const paragraphs = x.lesson
            .trim()
            .split(/\n\s*\n/)
            .filter(p => p.trim());

          if (paragraphs.length < 5 || paragraphs.length > 10) {
            fail("Lesson must contain 5-10 paragraphs");
          }

          if (
            !Array.isArray(x.examples) ||
            x.examples.length < 3 ||
            x.examples.length > 8
          ) {
            fail("There must be 3-8 examples");
          }

          x.examples.forEach((example, i) => {
            validateHindi(example, `Example ${i + 1}`);

            if (example.trim().length < 20) {
              fail(`Example ${i + 1} is too short`);
            }
          });

          if (x.why_it_matters.trim().length < 100) {
            fail("why_it_matters is too short");
          }

          if (x.common_misunderstanding.trim().length < 50) {
            fail("common_misunderstanding is too short");
          }

          if (x.reflection.trim().length < 20) {
            fail("Reflection is too short");
          }

          if (
            !Array.isArray(x.mcqs) ||
            x.mcqs.length !== 5
          ) {
            fail("Exactly 5 MCQs are required");
          }

          x.mcqs.forEach((m, i) => {
            const label = `MCQ ${i + 1}`;

            if (
              !m ||
              typeof m.question !== "string" ||
              !Array.isArray(m.options) ||
              m.options.length !== 4 ||
              typeof m.answer !== "string" ||
              typeof m.explanation !== "string"
            ) {
              fail(`${label}: invalid structure`);
            }

            validateHindi(m.question, `${label} question`);
            validateHindi(m.answer, `${label} answer`);
            validateHindi(m.explanation, `${label} explanation`);

            m.options.forEach((option, j) => {
              validateHindi(option, `${label} option ${j + 1}`);
            });

            const uniqueOptions = new Set(
              m.options.map(option => option.trim())
            );

            if (uniqueOptions.size !== 4) {
              fail(`${label}: duplicate options`);
            }

            if (!m.options.includes(m.answer)) {
              fail(`${label}: answer mismatch`);
            }

            if (m.explanation.trim().length < 20) {
              fail(`${label}: explanation too short`);
            }
          });

          if (
            !x.constitutional_reference ||
            typeof x.constitutional_reference !== "object"
          ) {
            fail("Missing constitutional_reference");
          }

          for (const field of [
            "articles",
            "parts",
            "references"
          ]) {
            if (!Array.isArray(x.constitutional_reference[field])) {
              fail(`Invalid constitutional_reference.${field}`);
            }
          }

          if (
            !x.source_metadata ||
            !Array.isArray(x.source_metadata.source_layers) ||
            !Array.isArray(x.source_metadata.source_files)
          ) {
            fail("Missing or invalid source_metadata");
          }

          if (Number(x.source_metadata.source_day) !== expectedDay) {
            fail("Source metadata day mismatch");
          }

          if (
            x.source_metadata.source_status !==
            "validated-before-generation"
          ) {
            fail("Source validation status mismatch");
          }

          console.log("==========================================");
          console.log("HINDI JSON VERIFICATION PASSED");
          console.log("==========================================");
          console.log("File:", file);
          console.log("Day:", x.day);
          console.log("Examples:", x.examples.length);
          console.log("MCQs:", x.mcqs.length);
          console.log("Paragraphs:", paragraphs.length);
          console.log(
            "Source layers:",
            x.source_metadata.source_layers.join(", ")
          );
          console.log("Hindi validation: PASSED");
          console.log("==========================================");
          NODE

      # ============================================================
      # COMMIT HINDI DAILY JSON
      # ============================================================

      - name: Commit Hindi Daily JSON
        shell: bash
        env:
          DAY: ${{ steps.day.outputs.day }}
        run: |
          set -euo pipefail

          FILE="data/hi/day-$(printf '%03d' "$DAY").json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Generate Constitution 365 Hindi Day $DAY"

          git push
